# 默认仓库：docker.gw.sury.cn/library
image:
  repository: docker.gw.sury.cn/library/cordiverse-paper
  pullPolicy: IfNotPresent
  tag: "0.1.5"

imagePullSecrets:
  - name: harbor-registry
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: paper.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: cordiverse-paper-tls
    #   hosts:
    #     - paper.example.com

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
