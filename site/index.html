<script>
(function () {
  const list = document.getElementById("paper-list");
  const bookmark = document.getElementById("bookmark-site");
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || "");
  const shortcut = mac ? "⌘+D" : "Ctrl+D";
  if (bookmark) {
    bookmark.title = "浏览器不允许脚本直接写入收藏夹，请按 " + shortcut;
    bookmark.addEventListener("click", function () {
      const hint = "请按 " + shortcut + " 收藏";
      const done = function (label) {
        bookmark.setAttribute("data-tip", label);
        bookmark.classList.add("tipped");
        clearTimeout(bookmark._tipTimer);
        bookmark._tipTimer = setTimeout(function () {
          bookmark.classList.remove("tipped");
          bookmark.removeAttribute("data-tip");
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(function () {
          done("已复制地址，" + hint);
        }).catch(function () { done(hint); });
      } else {
        done(hint);
      }
    });
  }

  let catalog = null;

  function curatedLabel(s) {
    const m = /^(\d{4})-(\d{2})$/.exec(String(s || ""));
    if (!m) return "";
    return "整理 " + m[1] + "年" + Number(m[2]) + "月";
  }

  const favIcon = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-2.8L6 20V5.5a1 1 0 0 1 1-1z"/></svg>';

  function card(p) {
    const reader = p.path ? p.path.replace(/\/?$/, "/index.html") : "";
    const saved = window.PaperFav && PaperFav.has(p.id);
    const actions = [];
    if (reader) {
      actions.push('<a class="primary" href="' + esc(reader) + '">进入阅读</a>');
      actions.push('<a class="ghost" href="' + esc(reader) + '#guide">先看导读</a>');
    }
    if (p.source) {
      actions.push('<a class="ghost" href="' + esc(p.source) + '" target="_blank" rel="noopener">原文</a>');
    }
    const date = curatedLabel(p.curated);
    const fav = p.id
      ? '<button type="button" class="fav' + (saved ? " on" : "") + '" data-id="' + esc(p.id) + '" aria-pressed="' + (saved ? "true" : "false") + '" aria-label="' + (saved ? "取消收藏" : "收藏") + '" title="' + (saved ? "取消收藏" : "收藏到本机") + '">' + favIcon + "</button>"
      : "";
    return (
      '<article class="card">' +
        fav +
        "<h2>" + esc(p.titleZh || p.title) + "</h2>" +
        (p.title && p.titleZh ? '<p class="en">' + esc(p.title) + "</p>" : "") +
        (p.authors ? '<p class="meta">' + esc(p.authors) + "</p>" : "") +
        (date ? '<p class="date">' + esc(date) + "</p>" : "") +
        (actions.length ? '<div class="actions">' + actions.join("") + "</div>" : "") +
      "</article>"
    );
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function fallback() {
    return {
      categories: [{ id: "runtime", titleZh: "运行时与可组合性" }],
      papers: [{
        id: "cordiverse",
        category: "runtime",
        title: "A Programming Paradigm for Spatiotemporal Composability",
        titleZh: "一种面向时空可组合性的编程范式",
        authors: "石一凡, 张伟, 崔天一 / Peking University, DeepSeek-AI",
        path: "papers/featured/cordiverse/",
        source: "https://github.com/cordiverse/paper",
        curated: "2026-08"
      }]
    };
  }

  function render(data) {
    catalog = data;
    const papers = (data && data.papers) || [];
    const cats = (data && data.categories) || [];
    const byId = {};
    const byCat = {};
    papers.forEach(function (p) {
      if (p.id) byId[p.id] = p;
      const key = p.category || "other";
      if (key === "featured") return;
      (byCat[key] || (byCat[key] = [])).push(p);
    });
    const html = [];
    const saved = (window.PaperFav ? PaperFav.load() : []).map(function (id) { return byId[id]; }).filter(Boolean);
    html.push('<section class="saved-box" id="saved" aria-labelledby="saved-title">');
    html.push('<h2 class="cat" id="saved-title">' + favIcon + "本地收藏</h2>");
    html.push('<p class="cat-note">只存在本机浏览器，清站点数据会丢失。</p>');
    if (saved.length) {
      html.push('<div class="list">' + saved.map(card).join("") + "</div>");
    } else {
      html.push('<p class="empty">尚未收藏。点卡片右上角书签，或在阅读页顶栏收藏。</p>');
    }
    html.push("</section>");
    const order = cats.length ? cats : Object.keys(byCat).map(function (id) { return { id: id, titleZh: id }; });
    order.forEach(function (c) {
      if (c.id === "featured") return;
      const items = byCat[c.id];
      if (!items || !items.length) return;
      html.push("<h2 class=\"cat\">" + esc(c.titleZh || c.title || c.id) + "</h2>");
      html.push('<div class="list">' + items.map(card).join("") + "</div>");
    });
    list.innerHTML = html.join("") || '<p class="empty">暂无文档</p>';
  }

  list.addEventListener("click", function (ev) {
    const btn = ev.target.closest("button.fav");
    if (!btn || !window.PaperFav) return;
    PaperFav.toggle(btn.getAttribute("data-id"));
    if (catalog) render(catalog);
  });

  window.addEventListener("storage", function (ev) {
    if (ev.key === (window.PaperFav && PaperFav.KEY) && catalog) render(catalog);
  });

  fetch("papers.json")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (data) { render(data && data.papers ? data : fallback()); })
    .catch(function () { render(fallback()); });
})();
</script>
