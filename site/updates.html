<script>
(function () {
  const log = document.getElementById("log");
  const bookmark = document.getElementById("bookmark-site");
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || "");
  const shortcut = mac ? "⌘+D" : "Ctrl+D";
  if (bookmark) {
    bookmark.title = "浏览器不允许脚本直接写入收藏夹，请按 " + shortcut;
    bookmark.addEventListener("click", function () {
      const hint = "请按 " + shortcut + " 收藏";
      const done = function (label) {
        bookmark.setAttribute("data-tip", label);
        bookmark.classList.add("tipped");
        clearTimeout(bookmark._tipTimer);
        bookmark._tipTimer = setTimeout(function () {
          bookmark.classList.remove("tipped");
          bookmark.removeAttribute("data-tip");
        }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.origin + location.pathname.replace(/[^/]+$/, "") + "index.html").then(function () {
          done("已复制馆藏地址，" + hint);
        }).catch(function () { done(hint); });
      } else {
        done(hint);
      }
    });
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function dateKey(s) {
    const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(String(s || ""));
    if (!m) return 0;
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3] || 1));
  }

  function dateLabel(s) {
    const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(String(s || ""));
    if (!m) return String(s || "");
    return m[3]
      ? m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日"
      : m[1] + "年" + Number(m[2]) + "月";
  }

  function paperLink(p) {
    const title = esc(p.titleZh || p.title || p.id);
    if (!p.path) return title;
    const href = p.path.replace(/\/?$/, "/index.html");
    return '<a href="' + esc(href) + '">' + title + "</a>";
  }

  function render(updates, papers) {
    const byId = {};
    (papers || []).forEach(function (p) {
      if (p && p.id) byId[p.id] = p;
    });
    const rows = (updates || []).slice().sort(function (a, b) {
      return dateKey(b.date) - dateKey(a.date);
    });
    if (!rows.length) {
      log.innerHTML = '<p class="empty">暂无更新记录。</p>';
      return;
    }
    const html = ['<ol class="timeline">'];
    rows.forEach(function (u) {
      const items = (u.items || []).map(function (t) {
        return "<li>" + esc(t) + "</li>";
      });
      (u.papers || []).forEach(function (id) {
        const p = byId[id] || { id: id, title: id };
        items.push("<li>" + paperLink(p) + "</li>");
      });
      html.push('<li class="entry">');
      html.push("<time datetime=\"" + esc(u.date) + "\">" + esc(dateLabel(u.date)) + "</time>");
      if (u.title) html.push("<h2>" + esc(u.title) + "</h2>");
      if (items.length) html.push("<ul>" + items.join("") + "</ul>");
      html.push("</li>");
    });
    html.push("</ol>");
    log.innerHTML = html.join("");
  }

  Promise.all([
    fetch("updates.json").then(function (r) { return r.ok ? r.json() : Promise.reject(); }),
    fetch("papers.json").then(function (r) { return r.ok ? r.json() : { papers: [] }; }).catch(function () { return { papers: [] }; })
  ]).then(function (pair) {
    const data = pair[0];
    render((data && data.updates) || data, (pair[1] && pair[1].papers) || []);
  }).catch(function () {
    log.innerHTML = '<p class="empty">更新记录载入失败。</p>';
  });
})();
</script>
